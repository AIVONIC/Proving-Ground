server {
    server_name provingground.aivonic.ai theprovingground.io www.theprovingground.io;

    root /var/www/html/pg;
    index index.html;

    # The early-access form is an unauthenticated public POST. The app has a
    # honeypot, but nothing bounded request VOLUME: there was no limit_req
    # anywhere in nginx on this host. Strictest limit on the write endpoint,
    # looser on the rest of /api/ so health polling is unaffected.
    location = /api/early-access {
        limit_req zone=pg_api_write burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8105;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1M;
    }

    location /api/ {
        limit_req zone=pg_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8105;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1M;
    }

    location = /methodology.html { return 301 /methodology; }

    # /report/ was renamed to /scorecards/ on 2026-08-22 to match what the page calls
    # itself. No card URL had been sent outside yet, which is exactly when a redirect
    # is free to add and impossible to add once a link is sitting in someone inbox.
    location ~ ^/report/(.*)$ { return 301 /scorecards/$1$is_args$args; }
    location = /report { return 301 /scorecards/; }

    # =404, NOT a fallback to /index.html. The fallback made every unknown URL
    # answer HTTP 200 with the homepage, which lets search engines index endless
    # soft-404s and made a removed file look like it was still being served.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    include /etc/nginx/snippets/security-headers.conf;
    # script-src can be 'self' with no hashes because index.html's JS was moved
    # into /app.js -- there is no inline script left to allow, and therefore
    # nothing that drifts out of sync when a page changes. style-src still needs
    # 'unsafe-inline' for the style block and the inline style="" attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    access_log /var/log/nginx/provingground.access.log;
    error_log /var/log/nginx/provingground.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/provingground.aivonic.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/provingground.aivonic.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}
server {
    if ($host = www.theprovingground.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = theprovingground.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = provingground.aivonic.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name provingground.aivonic.ai theprovingground.io www.theprovingground.io;
    return 404; # managed by Certbot






}
