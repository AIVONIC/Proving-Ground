# Langflow, pinned. The pin is the whole point: a grade names a version, and a
# floating :latest makes the number unreproducible the moment upstream ships.
#
# 1.12.1 is the newest STABLE release (2026-09-08); everything above it on the
# registry is a .dev build, and :latest resolves to this same digest.
#
# CHECKED 2026-09-13: the image is updated continuously (last push the same day),
# and the local API accepts unauthenticated calls when LANGFLOW_AUTO_LOGIN is on,
# which is what the build script and the grader use. THAT IS A SNAPSHOT OF SOMEONE
# ELSE'S PRODUCT, NOT A PROPERTY OF IT - if Langflow closes the headless path on a
# later line, this comment goes false while still looking authoritative. Re-check
# by standing up the current tag and calling the flows API with no session.
#
# SQLite in a named volume: a throwaway build target, torn down after grading, so
# there is no database worth standing up beside it.
services:
  langflow:
    image: langflowai/langflow:1.12.1
    container_name: pg-ref-langflow
    restart: unless-stopped
    ports: ["127.0.0.1:3500:7860"]
    environment:
      LANGFLOW_AUTO_LOGIN: "true"
      # Required since Langflow 1.5: AUTO_LOGIN alone still demands an API key
      # on the RUN endpoint, and says so in its own 403 body. Without it the
      # management API works, a flow builds fine, and every graded message
      # fails - which would have read as the agent being broken.
      LANGFLOW_SKIP_AUTH_AUTO_LOGIN: "true"
      LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "true"
      LANGFLOW_CONFIG_DIR: /app/langflow
    volumes:
      - langflow_data:/app/langflow
volumes:
  langflow_data:
#
# HEADLESS ACCESS, measured 2026-09-13: LANGFLOW_AUTO_LOGIN alone is not enough -
# /api/v1/flows/ returns 403 to an unauthenticated caller. GET /api/v1/auto_login
# returns a JWT, and that token as a Bearer header gives 200. The build script and
# the grade adapter both go through it.
