<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found — Proving Ground</title>
<style>
  :root {
    --ground: #0f1518; --panel: #151d20; --hair: #26312f;
    --ink: #e6e1d6; --ink-2: #b3bbb6; --muted: #828b86; --accent: #1ec9a8;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--ground); color: var(--ink); font-family: var(--sans);
    line-height: 1.6; padding: 24px; -webkit-font-smoothing: antialiased;
  }
  .box { max-width: 33rem; text-align: center }
  .code {
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 14px;
  }
  h1 { font-family: var(--serif); font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; margin: 0 0 14px; letter-spacing: -.01em }
  p { color: var(--ink-2); margin: 0 0 26px }
  .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap }
  a {
    display: inline-block; padding: 9px 17px; border-radius: 4px; text-decoration: none;
    font-size: 14px; border: 1px solid var(--hair); color: var(--ink); background: var(--panel);
  }
  a.primary { background: var(--accent); border-color: var(--accent); color: #04120e; font-weight: 600 }
  a:hover { border-color: var(--accent) }
  .note { margin-top: 30px; font-family: var(--mono); font-size: 11.5px; color: var(--muted) }
</style>
</head>
<body>
  <div class="box">
    <p class="code">Error 404</p>
    <h1>No page at this address.</h1>
    <p>It may have moved, or it may never have existed. The board and the methodology are both below.</p>
    <div class="links">
      <a class="primary" href="/leaderboard/">The leaderboard</a>
      <a href="/methodology">Methodology</a>
      <a href="/">Home</a>
    </div>
    <p class="note">Proving Ground &middot; an independent benchmark for AI agents</p>
  </div>
</body>
</html>
